name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify native provenance
        run: pwsh -NoLogo -NoProfile -File scripts/Test-NativeProvenance.ps1

      - name: Build and test native capture
        run: pwsh -NoLogo -NoProfile -File scripts/Build-Native.ps1 -Configuration Release -Fresh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore WinDayFlow.sln -p:Platform=x64

      - name: Build
        run: dotnet build WinDayFlow.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test WinDayFlow.sln -c Release -p:Platform=x64 --no-build --collect:"XPlat Code Coverage"

      - name: Format
        run: dotnet format WinDayFlow.sln --verify-no-changes --no-restore
